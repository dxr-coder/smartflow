# ========== K8s: Redis Deployment ==========
#
# 功能：部署 Redis 7（限流 + 语义缓存）
# 数据流：backend → redis:6379（rate:{user}:{minute} / chat:{question} / semantic:*）
#
# 单副本原因：Redis 是有状态服务（AOF 持久化），多副本需要 Redis Sentinel 或 Cluster
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: smartflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  strategy:
    type: Recreate          # 有状态服务：先杀旧 Pod 再起新 Pod，不能滚动
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # AOF 持久化：每个写命令落盘，重启不丢数据
          args: ["redis-server", "--appendonly", "yes"]
          ports:
            - containerPort: 6379
          # 资源限制：Redis 很轻，给 128Mi 足够
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # 存活探针：redis-cli ping
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          # 就绪探针：同上
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 2
            periodSeconds: 5
          # AOF 文件挂到 PVC 持久化
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
---
# PVC：Redis AOF 持久卷
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: smartflow
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# Service：ClusterIP，backend 通过 redis:6379 访问
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: smartflow
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
