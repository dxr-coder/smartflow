# ========== SmartFlow 前端 nginx 配置 ==========
#
# 功能：SPA 静态文件托管 + 15 个 API 前缀反代到 backend + SSE 特殊处理
# 数据流：浏览器请求 → nginx 判断路径 → 静态文件直接返回 / API 反代到 backend:8000

server {
    listen 80;
    server_name _;

    # gzip 压缩（js/css/html）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # ========== API 反代 ==========
    # 15 个前缀 → backend 服务（docker-compose 服务名 / K8s Service 名）

    # SSE 流式接口：必须关缓冲，否则 nginx 会攒够 buffer 才发给浏览器
    location /chat/stream {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 关键配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;   # LLM 生成慢，给足超时
        proxy_connect_timeout 10s;
    }

    # 其余 14 个 API 前缀
    location ~ ^/(auth|users|documents|stats|tickets|transfer|conversations|feedback|audit|ab-test|csat|eval|pdf|assets) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        # 文件上传大小限制（KB）——与后端 300MB 对齐
        client_max_body_size 300m;
    }

    # ========== SPA 静态文件 ==========
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA fallback：路径不存在时返回 index.html（Vue Router history 模式）
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（Vite 产物带 hash，可以长缓存）
    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
